name: build

# 触发：push 到 main、打 tag、手动作
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # CI 能做什么、不能做什么
  #
  # 【不能】编译 plugin/ —— 它需要 refs/*.dll（游戏程序集），
  #        而那是版权内容，被有意排除在仓库外。CI 上没有游戏。
  #        所以「从源码自动构建」在这类 Mod 项目上做不到，
  #        除非把游戏 DLL 传上去 —— 那正是我们不做的事。
  #
  # 【能做】(1) 安全闸：确认仓库里没有混进游戏内容
  #        (2) 产物完整性：dist/ 里的文件在不在、是不是有效 PE
  #        (3) 生成 SHA256 校验和，随 Release 一起发
  #        (4) 打 tag 时自动建 Release
  # ─────────────────────────────────────────────────────────────

  guard:
    name: 安全闸 + 产物完整性
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确认仓库里没有游戏内容
        shell: pwsh
        run: |
          $bad = @()
          # 游戏素材的扩展名
          $exts = @('.moc3', '.assets', '.bundle', '.resource', '.ress', '.dat', '.anm')
          # 游戏程序集的特征名
          $names = @('Assembly-CSharp', 'UnityEngine.', '0Harmony', 'Mono.Cecil', 'BepInEx.dll')

          $files = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          foreach ($f in $files) {
            $e = $f.Extension.ToLower()
            if ($exts -contains $e) { $bad += "扩展名: $($f.FullName)" }
            foreach ($n in $names) {
              if ($f.Name -like "*$n*" -and $f.Extension -ne '.cs') {
                $bad += "文件名: $($f.FullName)"
              }
            }
            # dll / exe 里不能内嵌 moc3
            if ($e -in @('.dll', '.exe')) {
              $bytes = [IO.File]::ReadAllBytes($f.FullName)
              $txt = [Text.Encoding]::ASCII.GetString($bytes)
              if ($txt -match 'moc3') { $bad += "内嵌 moc3: $($f.FullName)" }
            }
          }

          if ($bad.Count -gt 0) {
            Write-Host "::error::仓库里混进了游戏内容："
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "没有游戏素材、没有游戏程序集、exe/dll 里没有内嵌 moc3"
          Write-Host "  共检查 $($files.Count) 个文件"

      - name: 确认 dist/ 产物齐全
        shell: pwsh
        run: |
          # 插件文件名含数学乘号与方括号：用变量构造，
          # 且 Test-Path / Copy-Item 一律 -LiteralPath（-Path 会把方括号当通配字符类）
          $plug = '2' + [char]0x00D7 + '9+9L+6[ED]+7+2' + [char]0x00D7 + '45' + [char]0x2192 + '1[C]+LS.dll'

          $want = @(
            (Join-Path 'dist' $plug),
            'dist/数值修改器.exe',
            'dist/汉堡店修改器-安装程序.exe',
            'dist/使用说明.md'
          )
          $miss = @()
          foreach ($w in $want) { if (-not (Test-Path -LiteralPath $w)) { $miss += $w } }
          if ($miss.Count -gt 0) {
            Write-Host "::error::dist/ 缺文件："
            $miss | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          # 确认 exe/dll 是有效 PE（以 MZ 开头）
          foreach ($p in @((Join-Path 'dist' $plug), 'dist/数值修改器.exe', 'dist/汉堡店修改器-安装程序.exe')) {
            $b = [IO.File]::ReadAllBytes($p)
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { Write-Host "::error::$p 不是有效 PE"; exit 1 }
            $kb = [math]::Round($b.Length / 1KB)
            Write-Host "$p  (${kb} KB)"
          }

      - name: 确认安装程序自带了载荷
        shell: pwsh
        run: |
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path 'dist/汉堡店修改器-安装程序.exe'))
          $res = $asm.GetManifestResourceNames()
          Write-Host "内嵌资源: $($res -join ', ')"
          foreach ($need in @('payload.zip', 'art.png', 'art.ico')) {
            if ($res -notcontains $need) { Write-Host "::error::安装程序缺少内嵌资源 $need"; exit 1 }
          }
          Write-Host "安装程序自包含"

      - name: 静态一致性检查
        shell: pwsh
        env:
          # runner 的 Python 默认 cp1252，打印中文会崩
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          # 配置项要同时出现在 BindP3 / 面板 / set 命令 / 说明书里，
          # 漏掉任何一处都是【静默失败】。这里把它做成可自动检查的规则。
          python tools/static-check.py .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::静态一致性检查未通过"
            exit 1
          }
          Write-Host "静态一致性检查通过"

      - name: 生成 SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # 安装程序与修改器用 ASCII 名另存一份（Release 资产必须 ASCII）
          Copy-Item 'dist/汉堡店修改器-安装程序.exe' "out/18-9L-6_ED-7-45-45_C-LS-Installer.exe"
          Copy-Item 'dist/数值修改器.exe'            "out/18-9L-6_ED-7-45-45_C-LS-Trainer.exe"
          $plug = '2' + [char]0x00D7 + '9+9L+6[ED]+7+2' + [char]0x00D7 + '45' + [char]0x2192 + '1[C]+LS.dll'
          # 发布资产名保持可读的 BurgerShopModder.dll，只有源路径是程序集名
          Copy-Item -LiteralPath (Join-Path 'dist' $plug) "out/18-9L-6_ED-7-45-45_C-LS.dll"
          Copy-Item 'dist/使用说明.md'               'out/Manual-zh-CN.md'
          
          # 【只列 out/ 里的资产】
          # 原来遍历 dist/ 算哈希，但 dist/ 里可能有上一步 artifact 下载回来的旧文件 ——
          # v1.0.8 就因此把 v1.0.7 的旧哈希写进了表里，用户照着核对会以为文件被改过。
          # out/ 里就是最终要发布的四个文件，不会有残留。
          $lines = @()
          foreach ($f in Get-ChildItem -LiteralPath 'out' -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($f.Name)"
          }
          $lines | Set-Content -Encoding utf8 out/SHA256SUMS.txt
          Write-Host "校验和："
          $lines | ForEach-Object { Write-Host "  $_" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/

  release:
    name: 打 tag 时自动建 Release
    needs: guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out

      - name: 从 CHANGELOG 提取本版说明
        id: notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (Test-Path CHANGELOG.md) {
            $txt = Get-Content CHANGELOG.md -Raw
            # 抓 "## <tag>" 到下一个 "## " 之间
            $pat = "(?ms)^##\s+" + [regex]::Escape($tag) + "\s*\r?\n(.*?)(?=^##\s|\z)"
            $m = [regex]::Match($txt, $pat)
            if ($m.Success) {
              $m.Groups[1].Value.Trim() | Set-Content -Encoding utf8 notes.md
            }
          }
          if (-not (Test-Path notes.md)) {
            "见仓库 README 与 使用说明.md。" | Set-Content -Encoding utf8 notes.md
          }

      - name: 建 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "out/18-9L-6_ED-7-45-45_C-LS-Installer.exe",
            "out/18-9L-6_ED-7-45-45_C-LS-Trainer.exe",
            "out/18-9L-6_ED-7-45-45_C-LS.dll",
            'out/SHA256SUMS.txt'
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # 【不覆盖已存在的 release】
            # 这个 workflow 只做 dotnet build，**不签名**（没有证书）。
            # 而正式发布的资产是人工签名后上传的 —— 如果这里 clobber，
            # 那些带签名的文件会被未签名的构建产物替换掉。
            # 所以已存在就什么都不做，让人工发布的结果保持原样。
            Write-Host "Release $tag 已存在 —— 跳过。"
            Write-Host "  正式资产由人工签名后上传；这里不覆盖，避免把签名版本换掉。"
            exit 0
          }
          
          # 兜底：tag 打了但没人建 release 时，先建一个能用的。
          # 明确标注未签名，免得有人以为它和手动发布的一样。
          $banner = "> **注意：本页资产由 CI 构建，未经代码签名。**`n> 正式发布请以带 S.M.Y.T. 签名的版本为准。`n`n"
          Set-Content -Encoding utf8 notes-final.md -Value $banner
          Get-Content notes.md -Raw | Add-Content -Encoding utf8 notes-final.md
          gh release create $tag @assets --title "数值修改器 $tag" --notes-file notes-final.md
