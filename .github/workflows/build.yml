name: build

# Triggers: push to main, tag, manual run
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────
  # What CI can and cannot do here
  #
  # [cannot] Build plugin/ — it needs refs/*.dll (the game assemblies),
  #          and those are copyrighted content that is deliberately kept
  #          out of this repository. There is no game on CI, so
  #          "build from source" is impossible for this kind of mod
  #          unless the game DLLs were uploaded, which is exactly what
  #          we refuse to do.
  #
  # [can]    (1) Guard: prove no game content slipped into the repo
  #          (2) Artifact integrity: the files in dist/ exist and are PE
  #          (3) SHA256 checksums shipped alongside the release
  #          (4) Create the Release automatically on a tag
  # ─────────────────────────────────────────────────────────────

  guard:
    name: Guard — no game content, dist complete
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: No game assets or game assemblies in the repo
        shell: pwsh
        run: |
          $bad = @()
          # Extensions used by game assets
          $exts = @('.moc3', '.assets', '.bundle', '.resource', '.ress', '.dat', '.anm')
          # Names that identify the game assemblies
          $names = @('Assembly-CSharp', 'UnityEngine.', '0Harmony', 'Mono.Cecil', 'BepInEx.dll')

          $files = Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '\\\.git\\' }
          foreach ($f in $files) {
            $e = $f.Extension.ToLower()
            if ($exts -contains $e) { $bad += "extension: $($f.FullName)" }
            foreach ($n in $names) {
              if ($f.Name -like "*$n*" -and $f.Extension -ne '.cs') {
                $bad += "file name: $($f.FullName)"
              }
            }
            # dll / exe must not embed moc3
            if ($e -in @('.dll', '.exe')) {
              $bytes = [IO.File]::ReadAllBytes($f.FullName)
              $txt = [Text.Encoding]::ASCII.GetString($bytes)
              if ($txt -match 'moc3') { $bad += "embedded moc3: $($f.FullName)" }
            }
          }

          if ($bad.Count -gt 0) {
            Write-Host "::error::Game content found in the repository:"
            $bad | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          Write-Host "No game assets, no game assemblies, no embedded moc3 in exe/dll"
          Write-Host "  checked $($files.Count) files"

      - name: dist/ artifacts are present
        shell: pwsh
        run: |
          # The plugin file name contains a multiplication sign and square brackets,
          # so build it from code points and always use -LiteralPath
          # (-Path would treat the brackets as wildcard character classes).
          $plug = '2' + [char]0x00D7 + '9+9L+6[ED]+7+2' + [char]0x00D7 + '45' + [char]0x2192 + '1[C]+LS.dll'

          $want = @(
            (Join-Path 'dist' $plug),
            'dist/数值修改器.exe',
            'dist/汉堡店修改器-安装程序.exe',
            '使用说明.md'
          )
          $miss = @()
          foreach ($w in $want) { if (-not (Test-Path -LiteralPath $w)) { $miss += $w } }
          if ($miss.Count -gt 0) {
            Write-Host "::error::dist/ is missing files:"
            $miss | ForEach-Object { Write-Host "  $_" }
            exit 1
          }
          # Every exe/dll must be a valid PE (starts with MZ)
          foreach ($p in @((Join-Path 'dist' $plug), 'dist/数值修改器.exe', 'dist/汉堡店修改器-安装程序.exe')) {
            $b = [IO.File]::ReadAllBytes($p)
            if ($b[0] -ne 0x4D -or $b[1] -ne 0x5A) { Write-Host "::error::$p is not a valid PE"; exit 1 }
            $kb = [math]::Round($b.Length / 1KB)
            Write-Host "$p  (${kb} KB)"
          }

      - name: Installer carries its own payload
        shell: pwsh
        run: |
          $asm = [Reflection.Assembly]::LoadFrom((Resolve-Path 'dist/汉堡店修改器-安装程序.exe'))
          $res = $asm.GetManifestResourceNames()
          Write-Host "embedded resources: $($res -join ', ')"
          foreach ($need in @('payload.zip', 'art.png', 'art.ico')) {
            if ($res -notcontains $need) { Write-Host "::error::installer is missing embedded resource $need"; exit 1 }
          }
          Write-Host "installer is self-contained"

      - name: Static consistency check
        shell: pwsh
        env:
          # The runner's Python defaults to cp1252, which breaks on non-ASCII output
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: |
          # Every config entry must appear in BindP3 / the panel / the set command /
          # the manual. Missing any one of them is a SILENT failure, so it is a rule.
          python tools/static-check.py .
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::static consistency check failed"
            exit 1
          }
          Write-Host "static consistency check passed"

      - name: SHA256 checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          # Rename the installer and trainer to ASCII (release assets must be ASCII)
          Copy-Item 'dist/汉堡店修改器-安装程序.exe' "out/18-9L-6_ED-7-45-45_C-LS-Installer.exe"
          Copy-Item 'dist/数值修改器.exe'            "out/18-9L-6_ED-7-45-45_C-LS-Trainer.exe"
          $plug = '2' + [char]0x00D7 + '9+9L+6[ED]+7+2' + [char]0x00D7 + '45' + [char]0x2192 + '1[C]+LS.dll'
          Copy-Item -LiteralPath (Join-Path 'dist' $plug) "out/18-9L-6_ED-7-45-45_C-LS.dll"
          Copy-Item '使用说明.md'               'out/Manual-zh-CN.md'
          Copy-Item '使用说明.en.md'            'out/Manual-en.md'

          # [list only what is in out/]
          # It used to walk dist/, but dist/ can hold older files downloaded back
          # from a previous artifact — v1.0.8 shipped v1.0.7 hashes that way, and
          # anyone verifying a download would think the file had been tampered with.
          # out/ holds exactly the files about to be published.
          $lines = @()
          foreach ($f in Get-ChildItem -LiteralPath 'out' -File | Where-Object { $_.Name -ne 'SHA256SUMS.txt' } | Sort-Object Name) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$h  $($f.Name)"
          }
          $lines | Set-Content -Encoding utf8 out/SHA256SUMS.txt
          Write-Host "checksums:"
          $lines | ForEach-Object { Write-Host "  $_" }

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: out/

  release:
    name: Create the release on a tag
    needs: guard
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: out

      - name: Extract this version's notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (Test-Path CHANGELOG.md) {
            $txt = Get-Content CHANGELOG.md -Raw
            # Take "## <tag>" up to the next "## "
            $pat = "(?ms)^##\s+" + [regex]::Escape($tag) + "\s*\r?\n(.*?)(?=^##\s|\z)"
            $m = [regex]::Match($txt, $pat)
            if ($m.Success) {
              $m.Groups[1].Value.Trim() | Set-Content -Encoding utf8 notes.md
            }
          }
          if (-not (Test-Path notes.md)) {
            "See the repository README and 使用说明.md." | Set-Content -Encoding utf8 notes.md
          }

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $assets = @(
            "out/18-9L-6_ED-7-45-45_C-LS-Installer.exe",
            "out/18-9L-6_ED-7-45-45_C-LS-Trainer.exe",
            "out/18-9L-6_ED-7-45-45_C-LS.dll",
            'out/SHA256SUMS.txt'
          )
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            # [never clobber an existing release]
            # This workflow only runs dotnet build and does NOT sign anything
            # (there is no certificate here). The real assets are signed by hand
            # and uploaded afterwards, so clobbering would replace signed files
            # with unsigned build output. If a release exists, leave it alone.
            Write-Host "release $tag already exists — skipping."
            Write-Host "  the published assets are signed by hand; not overwriting them."
            exit 0
          }

          # Fallback: a tag was pushed but nobody created the release yet.
          # Mark it clearly as unsigned so nobody mistakes it for the real one.
          $banner = "> **Note: the assets on this page were built by CI and are NOT code-signed.**`n> Use the release carrying the S.M.Y.T. signature instead.`n`n"
          Set-Content -Encoding utf8 notes-final.md -Value $banner
          Get-Content notes.md -Raw | Add-Content -Encoding utf8 notes-final.md
          gh release create $tag @assets --title "数值修改器 $tag" --notes-file notes-final.md
